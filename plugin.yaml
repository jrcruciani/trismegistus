# Note: `manifest_version` is intentionally omitted (= v1, supported forever per Hermes docs).
# Hermes 0.23.x `plugins validate` requires `provides_middleware` to match `ctx.register_middleware`,
# while `plugins_manifest._KNOWN_MANIFEST_FIELDS` omits `provides_middleware` and logs a WARNING
# only when `manifest_version >= 2`. Omitting `manifest_version` keeps `config_schema`,
# `capabilities`, `requires_hermes`, and `provides_middleware` fully active with zero warnings.
name: trismegistus
version: "0.3.1"
requires_hermes: ">=0.23.0"
author: Jorge Luis Revilla
license: MIT
description: "Precision & speed System-1 / System-2 cognitive router (Triage -> Modulation -> Call) with Microsoft-Decision-1.1, conformal calibration, closed-loop precision guard, multimodal & KV-cache awareness."
optional_env:
  - TRISMEGISTUS_FOUNDRY_API_KEY
  - TRISMEGISTUS_SECONDARY_API_KEY
  - TRISMEGISTUS_LOCAL_API_KEY
provides_tools:
  - trismegistus_decide
  - trismegistus_escalate
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - pre_verify
  - post_api_request
provides_middleware:
  - llm_request
  - llm_execution
capabilities:
  - llm.model_override
  - llm.provider_override
config_schema:
  mode:
    type: str
    choices: [shadow, effort_only, tier_and_effort]
    default: shadow
    label: "Operating mode"
    description: "shadow logs System-1 verdicts without mutating calls; effort_only modulates reasoning_effort (100% KV-cache warm); tier_and_effort switches wire-compatible Copilot models + effort."
  backend:
    type: str
    choices: [foundry_systemone, local_systemone, local_logits, hermes_aux]
    default: foundry_systemone
    label: "System-1 Decision Backend"
    description: "foundry_systemone (Microsoft-Decision-1.1 on Foundry /providers/microsoft/v1/systemone), local_systemone (open-jev / SystemOne API), local_logits (llama.cpp / vLLM / Ollama 1-token logprobs), or hermes_aux (Hermes auxiliary.trismegistus_decider)."
  fallback_backend:
    type: str
    choices: [none, hermes_aux, local_systemone, local_logits]
    default: none
    label: "Optional Decision Fallback Backend"
    description: "Optional supported fallback (e.g. hermes_aux via ctx.llm) used when the primary backend is unavailable due to missing secret, expired token (401), or sustained rate limiting (429); 'none' fails open directly to System 2."
  foundry_endpoint:
    type: str
    default: ""
    label: "Microsoft Foundry Resource Endpoint"
    description: "Foundry endpoint URL (e.g. https://<resource>.services.ai.azure.com); /providers/microsoft/v1/systemone is appended automatically if omitted."
  foundry_deployment:
    type: str
    default: "microsoft-decision-1.1"
    label: "Foundry Deployment Name"
    description: "Deployment name in Microsoft Foundry for Microsoft-Decision-1.1 (sent as the request 'model' field)."
  foundry_auth_header:
    type: str
    choices: [auto, api-key, bearer]
    default: auto
    label: "Foundry Auth Header Mode"
    description: "auto detects Entra JWT access tokens ('Authorization: Bearer ***') vs static Foundry API keys ('api-key: ***'); api-key and bearer force the header explicitly."
  foundry_api_key:
    type: secret
    env: TRISMEGISTUS_FOUNDRY_API_KEY
    label: "Foundry API Key / Token"
    description: "API key or bearer token for Microsoft Foundry (stored in profile .env, never in config.yaml)."
  secondary_systemone_endpoint:
    type: str
    default: ""
    label: "Secondary Same-Model Decision Endpoint (Failover)"
    description: "Optional same-model Microsoft-Decision-1.1 failover endpoint ('openrouter', 'vercel', or an explicit Foundry/SystemOne URL) used immediately on primary 429/401/timeout without changing calibration."
  secondary_systemone_model:
    type: str
    default: ""
    label: "Secondary Decision Model ID"
    description: "Optional model identifier for the secondary same-model endpoint (auto-defaults for openrouter/vercel/foundry when empty)."
  secondary_api_key:
    type: secret
    env: TRISMEGISTUS_SECONDARY_API_KEY
    label: "Secondary Decision Endpoint API Key"
    description: "Optional API key for the secondary Microsoft-Decision-1.1 failover endpoint (stored in profile .env)."
  local_endpoint:
    type: str
    default: "http://127.0.0.1:8080/v1"
    label: "Local Decision Endpoint"
    description: "Base URL for local_systemone (/v1/systemone) or local_logits (/v1/chat/completions)."
  local_model:
    type: str
    default: "gemma-4-26b-a4b"
    label: "Local Decision Model ID"
    description: "Model identifier sent to local_systemone or local_logits."
  local_api_key:
    type: secret
    env: TRISMEGISTUS_LOCAL_API_KEY
    label: "Local Endpoint API Key (optional)"
    description: "Optional bearer key for a protected local inference server."
  confidence_threshold:
    type: float
    default: 0.82
    label: "Precision Confidence Threshold"
    description: "Asymmetric confidence floor (0-1) required before lowering effort to System 1; below 0.82 Trismegistus abstains upward to System 2."
  trap_risk_threshold:
    type: float
    default: 0.50
    label: "Hidden Trap Risk Threshold"
    description: "Maximum tolerated probability on the 'trap_risk' noul gate; at or above 0.50, low/minimal effort is blocked even for short prompts."
  step_pacing_enabled:
    type: bool
    default: true
    label: "Dynamic Intra-Turn Step Pacing"
    description: "In effort_only mode, pace early read-only exploration steps to low/medium effort on cache-resilient models, automatically restoring full effort before synthesis, dense reads, mutations, or errors."
  step_pacing_max_reads:
    type: int
    default: 2
    label: "Max Consecutive Paced Read Steps"
    description: "Maximum consecutive read-only scout steps paced down before restoring full base effort for diagnosis and synthesis."
  step_pacing_protect_claude_cache:
    type: bool
    default: true
    label: "Protect Claude Prompt Cache on Step Pacing"
    description: "Keep reasoning effort steady mid-turn on Claude models so thinking/effort prefix rendering never invalidates prompt cache breakpoints."
  fast_path_enabled:
    type: bool
    default: true
    label: "Sub-Millisecond S2 Structural Fast-Path"
    description: "Bypass triage network RTT in active modes for unmistakable deep-engineering inputs (multi-hunk diffs, stacktraces, large multi-file code, forced escalations). Never fast-paths down to System 1."
  multimodal_triage_enabled:
    type: bool
    default: true
    label: "Multimodal Triage Support"
    description: "Forward bounded image attachments to multimodal Decision-1.1 backends and veto blind System-1 downgrades on text-only backends."
  use_calibrated_thresholds:
    type: bool
    default: true
    label: "Use Backend Conformal Calibration Profile"
    description: "Automatically load backend-specific conformal thresholds from <HERMES_HOME>/plugin-data/trismegistus/calibration.json when present."
  closed_loop_enabled:
    type: bool
    default: true
    label: "Closed-Loop Precision Hardening"
    description: "Monitor implicit false-S1 signals (error streaks, mid-turn escalations, verify failures) and conservatively tighten thresholds under distribution shift."
  closed_loop_target_alpha:
    type: float
    default: 0.03
    label: "Closed-Loop Max False-S1 Budget (Alpha)"
    description: "Maximum tolerated observed false-S1 rate over the recent ledger window before conservative threshold hardening activates."
  system1_model:
    type: str
    default: ""
    label: "Explicit System-1 Model Override"
    description: "Optional fast model ID on the active provider (leave empty to auto-select the wire-compatible GitHub Copilot System-1 peer, e.g. claude-haiku-4.5, gpt-5.4-mini, gemini-3-flash-preview, gpt-5-mini)."
  system2_model:
    type: str
    default: ""
    label: "Explicit System-2 Model Override"
    description: "Optional deep-reasoning model ID on the active provider (leave empty to keep the session's active model or auto-select the Copilot System-2 peer)."
  delegation_provider:
    type: str
    default: "copilot"
    label: "Delegation Target Provider"
    description: "Provider used when delegation.backend is set to 'trismegistus' (default: copilot)."
  delegation_scout_model:
    type: str
    default: "gemini-3-flash-preview"
    label: "Delegation Fast Scout Model"
    description: "Model for parallel search, extraction, and reconnaissance subagents."
  delegation_deep_code_model:
    type: str
    default: "gpt-5.4"
    label: "Delegation Deep Code Model"
    description: "Model for algorithmic, debugging, concurrency, and test-fixing subagents (routed with xhigh effort)."
  delegation_architecture_model:
    type: str
    default: "claude-sonnet-5"
    label: "Delegation Architecture & Review Model"
    description: "Model for multi-file design, code review, and synthesis subagents (routed with high effort)."
  delegation_long_context_model:
    type: str
    default: "gemini-3.1-pro-preview"
    label: "Delegation Long-Context Model"
    description: "Model for large log, trace, or documentation cross-referencing subagents."
  delegation_system1_model:
    type: str
    default: "gemini-3-flash-preview"
    label: "Delegation Explicit System-1 Model"
    description: "Model assigned when cognitive_tier='system1' is passed explicitly."
  delegation_system2_model:
    type: str
    default: "gpt-5.4"
    label: "Delegation Explicit System-2 Model"
    description: "Model assigned when cognitive_tier='system2' is passed explicitly."
  escalate_after_errors:
    type: int
    default: 2
    label: "Auto-escalate After Tool Errors"
    description: "Consecutive tool errors in a session before automatically escalating the rest of the turn to System 2."
  sticky_system2_within_turn:
    type: bool
    default: true
    label: "Sticky System-2 Within Turn"
    description: "Keep System 2 active across tool-loop iterations once triggered so prompt KV cache is never invalidated mid-turn."
  tool_gate_enabled:
    type: bool
    default: false
    label: "Enable System-1 Mutating Tool Gate"
    description: "Evaluate terminal/write_file/patch/browser_exec calls with a calibrated noul risk check and escalate risky calls to human approval."
  tool_risk_threshold:
    type: float
    default: 0.82
    label: "Mutating Tool Approval Threshold"
    description: "Calibrated probability threshold (0-1) above which pre_tool_call requests human approval."
  verify_gate_enabled:
    type: bool
    default: true
    label: "Enable System-1 Code Verification Gate"
    description: "When code was edited in the turn, check via pre_verify whether verification evidence is present before stopping."
  keep_alive_enabled:
    type: bool
    default: true
    label: "Persistent TLS Keep-Alive to Foundry"
    description: "Reuse warm TLS 1.3 connections to Microsoft Foundry / local endpoints (~80-150 ms saved per triage)."
  timeout_seconds:
    type: float
    default: 1.2
    label: "Decision Timeout (seconds)"
    description: "Snappy wall-clock budget for System-1 triage calls (fail-open to System 2 on timeout)."
  max_retry_wait_seconds:
    type: float
    default: 2.0
    label: "Max Rate-Limit Retry Wait (seconds)"
    description: "Maximum Retry-After wait honored on HTTP 429 before failing open to System 2."
  triage_cache_ttl_seconds:
    type: float
    default: 180.0
    label: "Triage Decision Cache TTL (seconds)"
    description: "TTL for in-memory content-addressed caching of error-free System-1 verdicts across identical repeated prompts (0 disables)."
  max_excerpt_chars:
    type: int
    default: 4000
    label: "Max Redacted Excerpt Characters"
    description: "Maximum redacted head+tail prompt characters included in System-1 triage state (60% head + 40% tail)."
